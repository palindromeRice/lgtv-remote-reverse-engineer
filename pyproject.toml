[project]
name = "lg-tv-remote-research"
version = "0.1.0"
description = "Local-network Mac remote for LG webOS TVs"
requires-python = ">=3.12"
dependencies = ["bscpylgtv==0.5.5"]

[project.scripts]
lg-tv = "lg_tv_remote.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lg_tv_remote"]

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]
